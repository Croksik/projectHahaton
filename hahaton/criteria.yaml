# Критерии оценки отчётов наставников (19 шт.).
# Можно добавлять/менять критерии без правки кода — достаточно этого файла.
criteria:
  - id: leisure_hobbies
    name: Интересный досуг и поддержка увлечений
    description: Помощь подопечному в личностном развитии через хобби, интересы и чтение.
    rubric_1: В отчёте есть конкретное действие наставника — совместное занятие хобби, поддержка увлечения, чтение, выбор кружка или досуга.
    rubric_0: Тема досуга не упоминается, либо есть только общее описание встречи без поддержки увлечений.

  - id: emotional_support
    name: Эмоциональная поддержка
    description: Улучшение эмоционального состояния подопечного, помощь в управлении эмоциями.
    rubric_1: Наставник описывает поддержку, разговор о чувствах, помощь со стрессом, тревогой, злостью или грустью.
    rubric_0: Эмоциональная работа не описана; есть только факты встречи без поддержки чувств.

  - id: family_relations
    name: Отношения с родственниками
    description: Помощь в налаживании или обдумывании отношений подопечного с родственниками.
    rubric_1: Обсуждались семья, контакты с родственниками, конфликт или восстановление связи; наставник помогал обдумать ситуацию.
    rubric_0: Родственники не упоминаются или упоминаются без работы наставника с этой темой.

  - id: social_relations
    name: Взаимоотношения с другими людьми
    description: Помощь в выстраивании отношений со сверстниками, педагогами и другими людьми.
    rubric_1: Наставник помогал с дружбой, конфликтами, общением в коллективе или навыками коммуникации.
    rubric_0: Социальные отношения вне семьи не обсуждались.

  - id: family_values
    name: Семейные роли и ценности
    description: Обсуждение важности семьи, семейных ролей и ценностей в обществе и в будущем подопечного.
    rubric_1: Был разговор о семье как ценности, ролях в семье, будущем создании своей семьи.
    rubric_0: Тема семейных ценностей не поднималась.

  - id: household_skills
    name: Бытовые навыки
    description: Обучение бытовым навыкам и помощь в решении бытовых вопросов.
    rubric_1: Есть обучение или совместная практика готовки, уборки, покупок, гигиены, самостоятельного быта.
    rubric_0: Бытовые навыки не упоминаются.

  - id: career_guidance
    name: Профессиональное ориентирование
    description: Содействие в выборе профессии и поиске работы.
    rubric_1: Обсуждались профессии, склонности, колледж, курсы, ярмарки вакансий, выбор направления.
    rubric_0: Профориентация не обсуждалась.

  - id: employment
    name: Опыт трудоустройства
    description: Помощь с трудоустройством и адаптацией на рабочем месте.
    rubric_1: Наставник помогал с резюме, собеседованием, поиском вакансии, адаптацией на работе.
    rubric_0: Трудоустройство не упоминается.

  - id: education
    name: Учёба
    description: Поддержка подопечного в вопросах учёбы.
    rubric_1: Обсуждались школа/колледж, уроки, оценки, домашние задания; наставник помогал учиться или мотивировал.
    rubric_0: Учёба не упоминается.

  - id: health
    name: Здоровье
    description: Забота о здоровье через спорт, отказ от вредных привычек, сопровождение в лечении.
    rubric_1: Есть спорт, визит к врачу, режим сна/питания, сопровождение в лечении или обсуждение ЗОЖ.
    rubric_0: Тема здоровья не поднималась.

  - id: addictions
    name: Зависимости
    description: "Работа с темой зависимостей: вред, профилактика, помощь в отказе."
    rubric_1: Обсуждались курение, алкоголь, ПАВ, игромания или другие зависимости; наставник просвещал или поддерживал отказ.
    rubric_0: Зависимости не упоминаются.

  - id: romantic_relations
    name: Романтические отношения и секс
    description: Обсуждение романтических и интимных отношений, предохранения и деликатных тем.
    rubric_1: Был разговор о симпатии, отношениях, границах, предохранении или сексуальном просвещении.
    rubric_0: Тема не обсуждалась.

  - id: financial_literacy
    name: Финансовая грамотность
    description: Планирование трат, распоряжение деньгами, основы обращения с финансами.
    rubric_1: Обсуждались деньги, бюджет, накопления, покупки, зарплата, карты, финансовое планирование.
    rubric_0: Финансы не упоминаются.

  - id: legal_literacy
    name: Правовая грамотность
    description: Понимание последствий поступков и избегание нарушений закона.
    rubric_1: Обсуждались права, обязанности, закон, документы, последствия правонарушений.
    rubric_0: Правовые темы не поднимались.

  - id: safety_risks
    name: Безопасность, мошенничество и криминальные риски
    description: Предупреждение об опасностях, мошенничестве и криминальных рисках.
    rubric_1: Наставник предупреждал о мошенничестве, небезопасных местах, незнакомцах, рисках в интернете.
    rubric_0: Тема безопасности не поднималась.

  - id: future_plans
    name: Планы на будущее
    description: Совместное обсуждение планов на ближайшее будущее и на жизнь.
    rubric_1: Обсуждались цели, планы на месяц/год, выпуск, жильё, учёба или жизненные ориентиры.
    rubric_0: Планы на будущее не обсуждались.

  - id: wellbeing_growth
    name: Рост эмоционального благополучия
    description: Обобщающий критерий — признаки роста уверенности, инициативы, устойчивости к стрессу.
    rubric_1: В тексте есть признаки, что подопечный стал увереннее, инициативнее или лучше справляется со стрессом.
    rubric_0: Нет признаков положительной динамики эмоционального благополучия на этой встрече.

  - id: socialization_growth
    name: Рост социализации
    description: Обобщающий критерий — укрепление социальных связей и участия в коллективе.
    rubric_1: Есть признаки, что подопечный налаживает отношения, легче общается, участвует в коллективе.
    rubric_0: Нет признаков укрепления социализации на этой встрече.

  - id: independence_growth
    name: Рост самостоятельности
    description: Обобщающий критерий — готовность к самостоятельной жизни вне учреждения.
    rubric_1: Подопечный увереннее решает бытовые, учебные или жизненные вопросы сам; наставник отмечает рост независимости.
    rubric_0: Нет признаков роста самостоятельности на этой встрече.
